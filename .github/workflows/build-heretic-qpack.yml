name: Build Heretic QPack

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: Hugging Face destination repository (owner/name)
        required: true
        default: jbenzaquen/Qwen3.6-35B-A3B-Uncensored-Heretic-QPack
        type: string
      preflight_only:
        description: Only verify Tailscale, SMB write access, and HDD free space
        required: true
        default: true
        type: boolean

concurrency:
  group: build-heretic-qpack
  cancel-in-progress: false

jobs:
  repack:
    name: Repack MLX model on TrueNAS and publish to Hugging Face
    runs-on: macos-26
    timeout-minutes: 360
    permissions:
      contents: read

    env:
      SOURCE_REPO: froggeric/Qwen3.6-35B-A3B-Uncensored-Heretic-MLX-4bit
      SWIFTLET_COMMIT: 909c04213c9deb369dac0679d0872512cf3ab32e
      TRUENAS_HOST: 100.93.46.67
      TRUENAS_SHARE: qpack-builds
      QPACK_PARENT_RELATIVE_PATH: .
      QPACK_RELATIVE_PATH: qwen3.6-35b-heretic.qpack
      HF_XET_HIGH_PERFORMANCE: "1"

    steps:
      - name: Validate required secrets and input
        env:
          HF_DEST_REPO: ${{ inputs.hf_repo }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SMB_USERNAME: ${{ secrets.TRUENAS_SMB_USERNAME }}
          SMB_PASSWORD: ${{ secrets.TRUENAS_SMB_PASSWORD }}
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          for name in SMB_USERNAME SMB_PASSWORD TS_CLIENT_ID TS_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret $name is not configured."
              exit 1
            fi
          done

          if [ "$PREFLIGHT_ONLY" != "true" ] && [ -z "$HF_TOKEN" ]; then
            echo "::error::Repository secret HF_TOKEN is required to build and publish the QPack."
            exit 1
          fi

          if ! [[ "$HF_DEST_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::hf_repo must use the owner/name format."
            exit 1
          fi

      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout the Priv AI Swiftlet revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: leonickson1/Swiftlet
          ref: ${{ env.SWIFTLET_COMMIT }}
          path: Swiftlet

      - name: Apply bounded HTTP buffering fix
        if: ${{ inputs.preflight_only != true }}
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/patches/swiftlet-bounded-http-pump.patch"
          git -C Swiftlet apply --check "$PATCH"
          git -C Swiftlet apply "$PATCH"
          git -C Swiftlet diff --check
          git -C Swiftlet diff --stat

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          uname -m

      - name: Connect the runner to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        env:
          GOWORK: "off"
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.TRUENAS_HOST }}
          use-cache: "false"

      - name: Mount the TrueNAS build share
        id: storage
        env:
          SMB_USERNAME: ${{ secrets.TRUENAS_SMB_USERNAME }}
          SMB_PASSWORD: ${{ secrets.TRUENAS_SMB_PASSWORD }}
        run: |
          set -euo pipefail
          MOUNT_POINT="$RUNNER_TEMP/truenas-qpack"
          mkdir -p "$MOUNT_POINT"
          export MOUNT_POINT

          python3 - <<'PY'
          import os
          import subprocess
          from urllib.parse import quote

          user = quote(os.environ["SMB_USERNAME"], safe="")
          password = quote(os.environ["SMB_PASSWORD"], safe="")
          host = os.environ["TRUENAS_HOST"]
          share = quote(os.environ["TRUENAS_SHARE"], safe="")
          mount_point = os.environ["MOUNT_POINT"]
          remote = f"//{user}:{password}@{host}/{share}"
          # A soft mount makes a lost NAS connection fail file operations
          # instead of holding the hosted runner in a kernel-level SMB wait.
          subprocess.run(["mount", "-t", "smbfs", "-o", "soft,nobrowse", remote, mount_point], check=True)
          PY

          QPACK_PATH="$MOUNT_POINT/$QPACK_RELATIVE_PATH"
          QPACK_PARENT="$MOUNT_POINT/$QPACK_PARENT_RELATIVE_PATH"
          HF_XET_CACHE="$QPACK_PARENT/.hf-xet-cache"
          mkdir -p "$QPACK_PARENT"

          PROBE_PATH="$QPACK_PARENT/.gha-write-probe-$GITHUB_RUN_ID"
          printf '%s' "$GITHUB_RUN_ID" > "$PROBE_PATH"
          test "$(cat "$PROBE_PATH")" = "$GITHUB_RUN_ID"
          rm -f "$PROBE_PATH"

          AVAILABLE_KB="$(df -Pk "$MOUNT_POINT" | awk 'NR == 2 {print $4}')"
          REQUIRED_KB=$((50 * 1024 * 1024))
          if [ "$AVAILABLE_KB" -lt "$REQUIRED_KB" ]; then
            echo "::error::TrueNAS HDD share needs at least 50 GiB free for the QPack and resumable upload cache; only $((AVAILABLE_KB / 1024 / 1024)) GiB is available."
            exit 1
          fi

          echo "QPACK_PATH=$QPACK_PATH" >> "$GITHUB_ENV"
          echo "HF_XET_CACHE=$HF_XET_CACHE" >> "$GITHUB_ENV"
          echo "Mounted the dedicated TrueNAS qpack-builds HDD share with $((AVAILABLE_KB / 1024 / 1024)) GiB free."
          echo "SMB write probe passed. No model files were downloaded or written."

      - name: Build Swiftlet repacker
        if: ${{ inputs.preflight_only != true }}
        working-directory: Swiftlet
        run: swift build -c release --product swiftlet-repack

      - name: Lock source and converter revisions
        if: ${{ inputs.preflight_only != true }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$QPACK_PATH"

          SWIFTLET_SHA="$(git -C Swiftlet rev-parse HEAD)"
          SWIFTLET_PATCH_SHA="$(shasum -a 256 "$GITHUB_WORKSPACE/patches/swiftlet-bounded-http-pump.patch" | awk '{print $1}')"
          SOURCE_SHA="$({
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/api/models/$SOURCE_REPO"
          } | jq -er '.sha')"
          LOCK_PATH="$QPACK_PATH/source-lock.json"

          if [ -f "$LOCK_PATH" ]; then
            jq -e \
              --arg source_repo "$SOURCE_REPO" \
              --arg source_sha "$SOURCE_SHA" \
              --arg swiftlet_sha "$SWIFTLET_SHA" \
              --arg swiftlet_patch_sha "$SWIFTLET_PATCH_SHA" \
              '.source_repo == $source_repo
               and .source_sha == $source_sha
               and .swiftlet_sha == $swiftlet_sha
               and ((.swiftlet_patch_sha // $swiftlet_patch_sha) == $swiftlet_patch_sha)' \
              "$LOCK_PATH" >/dev/null || {
                echo "::error::Existing QPack work does not match the current source or Swiftlet revision."
                exit 1
              }
            if ! jq -e --arg swiftlet_patch_sha "$SWIFTLET_PATCH_SHA" \
              '.swiftlet_patch_sha == $swiftlet_patch_sha' "$LOCK_PATH" >/dev/null; then
              LOCK_TMP="$LOCK_PATH.tmp-$GITHUB_RUN_ID"
              jq --arg swiftlet_patch_sha "$SWIFTLET_PATCH_SHA" \
                '. + {swiftlet_patch_sha: $swiftlet_patch_sha}' "$LOCK_PATH" > "$LOCK_TMP"
              mv "$LOCK_TMP" "$LOCK_PATH"
              echo "Recorded the compatible transport patch in the existing checkpoint lock."
            fi
          elif find "$QPACK_PATH" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            echo "::error::Existing QPack work has no source lock; refusing to mix checkpoints."
            exit 1
          else
            jq -n \
              --arg source_repo "$SOURCE_REPO" \
              --arg source_sha "$SOURCE_SHA" \
              --arg swiftlet_sha "$SWIFTLET_SHA" \
              --arg swiftlet_patch_sha "$SWIFTLET_PATCH_SHA" \
              '{source_repo: $source_repo, source_sha: $source_sha, swiftlet_sha: $swiftlet_sha, swiftlet_patch_sha: $swiftlet_patch_sha}' \
              > "$LOCK_PATH"
          fi

      - name: Repack Heretic MLX checkpoint into QPack
        if: ${{ inputs.preflight_only != true }}
        working-directory: Swiftlet
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          run_repack_with_heartbeat() {
            .build/release/swiftlet-repack \
              --from-hf "$SOURCE_REPO" \
              --output "$QPACK_PATH" &
            local repack_pid=$!
            (
              while kill -0 "$repack_pid" 2>/dev/null; do
                stats="$(ps -p "$repack_pid" -o etime=,%cpu=,rss= 2>/dev/null || true)"
                if [ -n "$stats" ]; then
                  echo "Repack heartbeat (elapsed, CPU%, RSS_KB): $stats"
                fi
                sleep 60
              done
            ) &
            local heartbeat_pid=$!
            local status=0
            wait "$repack_pid" || status=$?
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
            return "$status"
          }

          if [ -f "$QPACK_PATH/manifest.json" ]; then
            jq -e '.magic == "QPACK" and .version == 1' "$QPACK_PATH/manifest.json" >/dev/null
            echo "A completed QPack manifest already exists; skipping conversion and continuing validation/upload."
          else
            attempt=1
            max_attempts=3
            while true; do
              echo "Starting resumable QPack repack attempt $attempt of $max_attempts."
              if run_repack_with_heartbeat; then
                break
              else
                status=$?
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::QPack repack failed after $attempt attempts. Checkpoint files are retained for the next run."
                exit "$status"
              fi
              attempt=$((attempt + 1))
              echo "::warning::Repack attempt failed with exit code $status; retrying from the on-disk progress checkpoint in 20 seconds."
              sleep 20
            done
          fi

          CURRENT_SOURCE_SHA="$({
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/api/models/$SOURCE_REPO"
          } | jq -er '.sha')"
          LOCKED_SOURCE_SHA="$(jq -er '.source_sha' "$QPACK_PATH/source-lock.json")"
          if [ "$CURRENT_SOURCE_SHA" != "$LOCKED_SOURCE_SHA" ]; then
            echo "::error::The source repository changed during conversion; refusing to publish mixed weights."
            exit 1
          fi

      - name: Validate QPack structure
        if: ${{ inputs.preflight_only != true }}
        run: |
          set -euo pipefail
          test -f "$QPACK_PATH/manifest.json"
          test -f "$QPACK_PATH/model.safetensors"
          test -f "$QPACK_PATH/packed_experts/layout.json"

          jq -e '
            .magic == "QPACK"
            and .version == 1
            and .quantBits == 4
            and .quantGroupSize == 64
          ' "$QPACK_PATH/manifest.json" >/dev/null

          LAYER_COUNT="$(find "$QPACK_PATH/packed_experts" -type f -name 'layer_*.bin' | wc -l | tr -d ' ')"
          if [ "$LAYER_COUNT" -ne 40 ]; then
            echo "::error::Expected 40 expert layer files, found $LAYER_COUNT."
            exit 1
          fi

          jq '{magic, version, modelName, quantBits, quantGroupSize}' "$QPACK_PATH/manifest.json"
          du -sh "$QPACK_PATH"

      - name: Add Hugging Face model card
        if: ${{ inputs.preflight_only != true }}
        env:
          HF_DEST_REPO: ${{ inputs.hf_repo }}
        run: |
          set -euo pipefail
          cat > "$QPACK_PATH/README.md" <<EOF
          ---
          license: apache-2.0
          tags:
          - swiftlet
          - qpack
          - qwen3
          - qwen3.6
          - mixture-of-experts
          - heretic
          base_model: llmfan46/Qwen3.6-35B-A3B-uncensored-heretic
          ---

          # Qwen3.6 35B-A3B Uncensored Heretic QPack

          Swiftlet QPack generated from
          [froggeric/Qwen3.6-35B-A3B-Uncensored-Heretic-MLX-4bit](https://huggingface.co/froggeric/Qwen3.6-35B-A3B-Uncensored-Heretic-MLX-4bit)
          for use with the Swiftlet runtime and Priv AI.

          Destination: $HF_DEST_REPO

          This package preserves the source MLX affine 4-bit, group-size-64 text weights.
          Swiftlet QPack currently excludes the source checkpoint's vision and MTP tensors.
          EOF

      - name: Install Hugging Face uploader
        if: ${{ inputs.preflight_only != true }}
        run: |
          python3 -m venv "$RUNNER_TEMP/hf-venv"
          "$RUNNER_TEMP/hf-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/hf-venv/bin/pip" install --upgrade huggingface_hub hf_xet
          echo "$RUNNER_TEMP/hf-venv/bin" >> "$GITHUB_PATH"

      - name: Create repository and upload QPack
        if: ${{ inputs.preflight_only != true }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DEST_REPO: ${{ inputs.hf_repo }}
          HF_HOME: ${{ runner.temp }}/huggingface
          HF_HUB_CACHE: ${{ runner.temp }}/huggingface/hub
        run: |
          set -euo pipefail
          export PATH="$HOME/Library/Python/$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')/bin:$PATH"
          hf auth whoami
          hf repos create "$HF_DEST_REPO" --exist-ok
          hf upload "$HF_DEST_REPO" "$QPACK_PATH" . \
            --commit-message "Publish Swiftlet Heretic QPack"

      - name: Verify published repository layout
        if: ${{ inputs.preflight_only != true }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DEST_REPO: ${{ inputs.hf_repo }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo = os.environ["HF_DEST_REPO"]
          files = set(HfApi(token=os.environ["HF_TOKEN"]).list_repo_files(repo))
          required = {
              "README.md",
              "manifest.json",
              "config.json",
              "model.safetensors",
              "packed_experts/layout.json",
              *{f"packed_experts/layer_{index:02d}.bin" for index in range(40)},
          }
          missing = sorted(required - files)
          if missing:
              raise SystemExit("Published repository is missing: " + ", ".join(missing))
          print(f"Verified {len(required)} required QPack files in {repo}.")
          PY

      - name: Unmount TrueNAS
        if: always()
        run: |
          if mount | grep -Fq " on $RUNNER_TEMP/truenas-qpack "; then
            diskutil unmount force "$RUNNER_TEMP/truenas-qpack" \
              || true
          fi
