name: Build SideStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "localLLM/**"
      - "localLLM.xcodeproj/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    name: Build unsigned iPhone IPA
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: Checkout Priv AI
        uses: actions/checkout@v4

      - name: Checkout Swiftlet sibling dependency
        run: |
          git clone --depth 1 https://github.com/leonickson1/Swiftlet.git ../swiftlet

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -skipMacroValidation \
            -project localLLM.xcodeproj \
            -scheme localLLM

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project localLLM.xcodeproj \
            -scheme localLLM \
            -skipMacroValidation \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jbenzaquen42.PrivAI \
            DEVELOPMENT_TEAM='' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/localLLM.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at: $APP_PATH"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 3 -type d -name '*.app' -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/PrivAI-SideStore.ipa" Payload

          echo "IPA created:"
          ls -lh "$GITHUB_WORKSPACE/PrivAI-SideStore.ipa"

      - name: Generate SideStore source
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/localLLM.app/Info.plist")"
          fi
          IPA_SIZE="$(stat -f%z PrivAI-SideStore.ipa)"
          RELEASE_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          jq -n \
            --arg version "$APP_VERSION" \
            --arg date "$RELEASE_DATE" \
            --arg downloadURL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/PrivAI-SideStore.ipa" \
            --argjson size "$IPA_SIZE" \
            '{
              name: "Priv AI",
              identifier: "com.jbenzaquen42.privai.source",
              subtitle: "Private on-device AI for iPhone",
              description: "Install and update Priv AI through SideStore.",
              website: "https://github.com/jbenzaquen42/localllm",
              sourceURL: "https://github.com/jbenzaquen42/localllm/releases/latest/download/sidestore.json",
              apps: [{
                name: "Priv AI",
                bundleIdentifier: "com.jbenzaquen42.PrivAI",
                developerName: "Jacob Benzaquen",
                subtitle: "Local GGUF, MLX, and Swiftlet inference",
                localizedDescription: "Run private language models on your iPhone, including GGUF, native MLX checkpoints, and Swiftlet QPack models.",
                iconURL: "https://raw.githubusercontent.com/jbenzaquen42/localllm/main/AppIcon.png",
                tintColor: "2864DC",
                versions: [{
                  version: $version,
                  date: $date,
                  localizedDescription: "Adds Hugging Face repository import, quantization selection, and native MLX model support.",
                  downloadURL: $downloadURL,
                  size: $size,
                  minOSVersion: "17.0"
                }]
              }]
            }' > sidestore.json

          jq empty sidestore.json

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrivAI-SideStore
          path: |
            PrivAI-SideStore.ipa
            sidestore.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish SideStore release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            PrivAI-SideStore.ipa \
            sidestore.json \
            --title "Priv AI $GITHUB_REF_NAME" \
            --generate-notes

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
