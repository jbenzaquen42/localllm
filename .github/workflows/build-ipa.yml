name: Build SideStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "localLLM/**"
      - "localLLM.xcodeproj/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    name: Build unsigned iPhone IPA
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: Checkout Priv AI
        uses: actions/checkout@v4

      - name: Checkout Swiftlet sibling dependency
        run: |
          git init ../swiftlet
          git -C ../swiftlet remote add origin https://github.com/leonickson1/Swiftlet.git
          git -C ../swiftlet fetch --depth 1 origin 909c04213c9deb369dac0679d0872512cf3ab32e
          git -C ../swiftlet checkout --detach FETCH_HEAD

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -skipMacroValidation \
            -project localLLM.xcodeproj \
            -scheme localLLM

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project localLLM.xcodeproj \
            -scheme localLLM \
            -skipMacroValidation \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER=com.jbenzaquen42.PrivAI \
            DEVELOPMENT_TEAM='' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/localLLM.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at: $APP_PATH"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 3 -type d -name '*.app' -print || true
            exit 1
          fi

          # SideStore reads requested entitlements from the app's existing
          # Mach-O signature before re-signing it with the user's profile.
          # Preserve HealthKit in this otherwise distribution-unsigned build.
          find "$APP_PATH/Frameworks" -type d -name '*.framework' -prune -print0 2>/dev/null \
            | while IFS= read -r -d '' framework; do
                codesign --force --sign - --timestamp=none "$framework"
              done
          find "$APP_PATH/Frameworks" -type f -name '*.dylib' -print0 2>/dev/null \
            | while IFS= read -r -d '' dylib; do
                codesign --force --sign - --timestamp=none "$dylib"
              done
          codesign --force --sign - --timestamp=none \
            --entitlements "$GITHUB_WORKSPACE/localLLM/localLLM.entitlements" \
            "$APP_PATH"

          codesign --verify --deep --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" 2>/dev/null > "$RUNNER_TEMP/source-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' "$RUNNER_TEMP/source-entitlements.plist"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/PrivAI-SideStore.ipa" Payload

          echo "IPA created:"
          ls -lh "$GITHUB_WORKSPACE/PrivAI-SideStore.ipa"

      - name: Generate SideStore source
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
            DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/PrivAI-SideStore.ipa"
          else
            APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/localLLM.app/Info.plist")"
            DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/PrivAI-SideStore.ipa"
          fi

          IPA_SIZE="$(stat -f%z PrivAI-SideStore.ipa)"
          RELEASE_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          git fetch origin main
          PREVIOUS_SOURCE="$RUNNER_TEMP/previous-source.json"
          if git show origin/main:source.json > "$PREVIOUS_SOURCE" 2>/dev/null; then
            echo "Preserving existing SideStore version history"
          else
            : > "$PREVIOUS_SOURCE"
          fi

          NEW_VERSION=$(jq -n \
            --arg version "$APP_VERSION" \
            --arg date "$RELEASE_DATE" \
            --arg downloadURL "$DOWNLOAD_URL" \
            --argjson size "$IPA_SIZE" \
            '{
              version: $version,
              date: $date,
              localizedDescription: "Makes Hugging Face installs visibly confirm success or show an actionable error, adds HTTP and transfer diagnostics, and displays the real app version and build number.",
              downloadURL: $downloadURL,
              size: $size,
              minOSVersion: "17.0"
            }')

          if [ -s "$PREVIOUS_SOURCE" ]; then
            jq \
              --argjson newVersion "$NEW_VERSION" \
              '.name = "Jacob\u0027s Apps"
               | .identifier = "com.jbenzaquen42.privai.source"
               | .sourceURL = "https://raw.githubusercontent.com/jbenzaquen42/localllm/main/source.json"
               | .apps[0].name = "Priv AI"
               | .apps[0].bundleIdentifier = "com.jbenzaquen42.PrivAI"
               | .apps[0].developerName = "Jacob Benzaquen"
               | .apps[0].subtitle = "Local GGUF, MLX, and Swiftlet inference"
               | .apps[0].localizedDescription = "Run private language models directly on your iPhone, including GGUF, native MLX checkpoints, and Swiftlet QPack models."
               | .apps[0].iconURL = "https://raw.githubusercontent.com/jbenzaquen42/localllm/main/AppIcon.png"
               | .apps[0].tintColor = "2864DC"
               | .apps[0].versions = ([$newVersion] + [ .apps[0].versions[]? | select(.version != $newVersion.version) ])' \
              "$PREVIOUS_SOURCE" > source.json
          else
            jq -n \
              --argjson version "$NEW_VERSION" \
              '{
                name: "Jacob\u0027s Apps",
                identifier: "com.jbenzaquen42.privai.source",
                sourceURL: "https://raw.githubusercontent.com/jbenzaquen42/localllm/main/source.json",
                apps: [{
                  name: "Priv AI",
                  bundleIdentifier: "com.jbenzaquen42.PrivAI",
                  developerName: "Jacob Benzaquen",
                  subtitle: "Local GGUF, MLX, and Swiftlet inference",
                  localizedDescription: "Run private language models directly on your iPhone, including GGUF, native MLX checkpoints, and Swiftlet QPack models.",
                  iconURL: "https://raw.githubusercontent.com/jbenzaquen42/localllm/main/AppIcon.png",
                  tintColor: "2864DC",
                  versions: [$version]
                }]
              }' > source.json
          fi

          jq empty source.json
          # Keep the v1.1.0 release URL working for users who already added it.
          cp source.json sidestore.json
          cat source.json

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrivAI-SideStore
          path: |
            PrivAI-SideStore.ipa
            source.json
            sidestore.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish SideStore release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              PrivAI-SideStore.ipa \
              source.json \
              sidestore.json \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              PrivAI-SideStore.ipa \
              source.json \
              sidestore.json \
              --title "Priv AI $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Update canonical SideStore feed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp source.json "$RUNNER_TEMP/source.json"
          # The generated feed modifies a tracked file on a detached tag.
          # Restore it before switching branches; the generated copy is safe
          # in RUNNER_TEMP and is copied back immediately afterwards.
          git restore --source=HEAD --worktree -- source.json
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/source.json" source.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json

          if git diff --cached --quiet; then
            echo "source.json is already current"
          else
            git commit -m "Update SideStore feed for $GITHUB_REF_NAME"
            git push origin main
          fi

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
